apiVersion: apps/v1
kind: Deployment
metadata:
  name: ada-frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ada-frontend:latest
        ports:
        - containerPort: 8080
        env:
        - name: BACKEND_URL
          value: http://ada-backend-service:8080
