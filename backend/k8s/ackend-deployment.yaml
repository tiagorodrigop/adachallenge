apiVersion: apps/v1
kind: Deployment
metadata:
  name: ada-backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ada-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: ada-database.us-east-1.rds.amazonaws.com
        - name: DB_USER
          value: admin
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
